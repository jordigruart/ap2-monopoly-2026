<!DOCTYPE html>
<html>
<head>
    <title>Monopoly Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        #svg-display {
            max-width: 90vw;
            max-height: 85vh;
        }
        .controls {
            margin-top: 0px;
        }
        button {
            font-size: 32px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .info {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="svg-display" src="turn-0001-a.svg" alt="SVG Image">
        <div class="controls">
            <button id="btn-first" onclick="goToFirst()">⏮️</button>
            <button id="btn-prev" onclick="goToPrev()">⬅️</button>
            <button id="btn-next" onclick="goToNext()">➡️</button>
            <button id="btn-last" onclick="goToLast()">⏭️</button>
        </div>
        <div class="info">
            <span id="current-info">1 / 63</span>
        </div>
    </div>
    
    <script>
        const svgPaths = ['imgs/turn-0001-a.svg', 'imgs/turn-0001-b.svg', 'imgs/turn-0001-c.svg', 'imgs/turn-0002-a.svg', 'imgs/turn-0002-b.svg', 'imgs/turn-0002-c.svg', 'imgs/turn-0003-a.svg', 'imgs/turn-0003-b.svg', 'imgs/turn-0003-c.svg', 'imgs/turn-0004-a.svg', 'imgs/turn-0004-b.svg', 'imgs/turn-0004-c.svg', 'imgs/turn-0005-a.svg', 'imgs/turn-0005-b.svg', 'imgs/turn-0005-c.svg', 'imgs/turn-0006-a.svg', 'imgs/turn-0006-b.svg', 'imgs/turn-0006-c.svg', 'imgs/turn-0007-a.svg', 'imgs/turn-0007-b.svg', 'imgs/turn-0007-c.svg', 'imgs/turn-0008-a.svg', 'imgs/turn-0008-b.svg', 'imgs/turn-0008-c.svg', 'imgs/turn-0009-a.svg', 'imgs/turn-0009-b.svg', 'imgs/turn-0009-c.svg', 'imgs/turn-0010-a.svg', 'imgs/turn-0010-b.svg', 'imgs/turn-0010-c.svg', 'imgs/turn-0011-a.svg', 'imgs/turn-0011-b.svg', 'imgs/turn-0011-c.svg', 'imgs/turn-0012-a.svg', 'imgs/turn-0012-b.svg', 'imgs/turn-0012-c.svg', 'imgs/turn-0013-a.svg', 'imgs/turn-0013-b.svg', 'imgs/turn-0013-c.svg', 'imgs/turn-0014-a.svg', 'imgs/turn-0014-b.svg', 'imgs/turn-0014-c.svg', 'imgs/turn-0015-a.svg', 'imgs/turn-0015-b.svg', 'imgs/turn-0015-c.svg', 'imgs/turn-0016-a.svg', 'imgs/turn-0016-b.svg', 'imgs/turn-0016-c.svg', 'imgs/turn-0017-a.svg', 'imgs/turn-0017-b.svg', 'imgs/turn-0017-c.svg', 'imgs/turn-0018-a.svg', 'imgs/turn-0018-b.svg', 'imgs/turn-0018-c.svg', 'imgs/turn-0019-a.svg', 'imgs/turn-0019-b.svg', 'imgs/turn-0019-c.svg', 'imgs/turn-0020-a.svg', 'imgs/turn-0020-b.svg', 'imgs/turn-0020-c.svg', 'imgs/turn-0021-a.svg', 'imgs/turn-0021-b.svg', 'imgs/turn-0021-c.svg'];
        let currentIndex = 0;
        
        function updateDisplay() {
            const img = document.getElementById('svg-display');
            img.src = svgPaths[currentIndex];
            
            document.getElementById('current-info').textContent = 
                (currentIndex + 1) + ' / ' + svgPaths.length;
            
            // Update button states
            document.getElementById('btn-first').disabled = currentIndex === 0;
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === svgPaths.length - 1;
            document.getElementById('btn-last').disabled = currentIndex === svgPaths.length - 1;
        }
        
        function goToFirst() {
            currentIndex = 0;
            updateDisplay();
        }
        
        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }
        
        function goToNext() {
            if (currentIndex < svgPaths.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        }
        
        function goToLast() {
            currentIndex = svgPaths.length - 1;
            updateDisplay();
        }
        
        // Initialize on page load
        updateDisplay();
    </script>
</body>
</html>
